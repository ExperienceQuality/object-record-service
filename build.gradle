plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.xq'
version = '0.0.1-SNAPSHOT'
description = 'Routine service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    e2e {
        java.srcDir 'src/e2e/java'
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'GitHubPackages'
        url = uri('https://maven.pkg.github.com/ExperienceQuality/jvm-test-kit')
        credentials {
            username = providers.environmentVariable('GITHUB_ACTOR').orNull
            password = providers.environmentVariable('GITHUB_TOKEN').orNull
        }
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.flywaydb:flyway-database-postgresql'

    runtimeOnly 'org.postgresql:postgresql'

    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'io.swagger.parser.v3:swagger-parser-v3:2.1.45'
    testImplementation 'org.yaml:snakeyaml'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    e2eImplementation 'org.junit.jupiter:junit-jupiter-api'
    e2eImplementation 'com.xq:jvm-test-kit:2.0.0'
    e2eRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    e2eRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'deployment'
    }
}

tasks.register('validateDeployment', Test) {
    description = 'Validates the Render deployment Blueprint.'
    group = 'verification'
    dependsOn tasks.named('testClasses')
    inputs.file(layout.projectDirectory.file('render.yaml'))
    inputs.file(layout.projectDirectory.file('src/main/resources/application-prod.yml'))
    inputs.file(layout.projectDirectory.file('src/main/resources/application-e2e.yml'))
    inputs.file(layout.projectDirectory.file('src/main/resources/application-integration.yml'))
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'deployment'
    }
}

tasks.named('bootJar') {
    mustRunAfter tasks.named('check')
}

tasks.register('packageService', Sync) {
    description = 'Packages the executable routine-service JAR.'
    group = 'build'
    dependsOn tasks.named('bootJar')
    from tasks.named('bootJar').flatMap { it.archiveFile }
    into layout.buildDirectory.dir('service')
    rename { 'routine-service.jar' }
}

tasks.register('ci') {
    description = 'Runs CI verification and packages the service.'
    group = 'verification'
    dependsOn tasks.named('check')
    dependsOn tasks.named('packageService')
    dependsOn tasks.named('validateDeployment')
}

tasks.register('e2eTest', Test) {
    description = 'Runs end-to-end tests.'
    group = 'verification'
    dependsOn tasks.named('e2eClasses')
    testClassesDirs = sourceSets.e2e.output.classesDirs
    classpath = sourceSets.e2e.runtimeClasspath
    useJUnitPlatform()
    outputs.upToDateWhen { false }
}

tasks.register('e2e') {
    description = 'Runs the end-to-end acceptance suite against XQORB_BASE_URI.'
    group = 'verification'
    dependsOn tasks.named('e2eTest')
}
