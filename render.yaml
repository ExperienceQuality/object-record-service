# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: web
    name: routine-service
    runtime: image
    region: singapore
    plan: free
    image:
      url: ghcr.io/experiencequality/routine-service:0.1.0
      creds:
        fromRegistryCreds:
          name: xq-ghcr
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DOCKER_COMPOSE_ENABLED
        value: "false"
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
