spring:
  application:
    name: routine-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/routine_service}
    username: ${SPRING_DATASOURCE_USERNAME:routine_service}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:routine_service_pw}}
  docker:
    compose:
      file: compose.yaml
      lifecycle-management: start-and-stop
  flyway:
    clean-disabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    validate-on-migrate: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
