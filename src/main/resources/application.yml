spring:
  application:
    name: routine-service
  datasource:
    url: jdbc:postgresql://localhost:5432/routine_service
    username: routine_service
    password: ${POSTGRES_PASSWORD:routine_service_pw}
  docker:
    compose:
      file: compose.yaml
      lifecycle-management: start-and-stop
  flyway:
    clean-disabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    validate-on-migrate: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
