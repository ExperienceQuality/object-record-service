name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: ci-test-password
      XQORB_BASE_URI: http://localhost:8080

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit, integration, contract, and packaging checks
        run: ./gradlew --no-daemon clean test bootJar

      - name: Start PostgreSQL 18
        run: docker compose up -d --wait

      - name: Start packaged service
        env:
          SPRING_DOCKER_COMPOSE_ENABLED: "false"
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/routine_service
          SPRING_DATASOURCE_USERNAME: routine_service
          SPRING_DATASOURCE_PASSWORD: ci-test-password
        run: |
          application_jar=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' -print -quit)
          if [[ -z "$application_jar" ]]; then
            echo "Executable Spring Boot JAR was not found" >&2
            exit 1
          fi
          java -jar "$application_jar" > build/application.log 2>&1 &
          echo "$!" > build/application.pid

      - name: Wait for service health
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent "$XQORB_BASE_URI/actuator/health" >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat build/application.pid)" 2>/dev/null; then
              cat build/application.log
              exit 1
            fi
            sleep 2
          done
          cat build/application.log
          exit 1

      - name: Run end-to-end business scenarios
        run: ./gradlew --no-daemon e2e

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/application.log
            build/libs/*.jar
            build/reports/
            build/test-results/

      - name: Stop service and PostgreSQL
        if: always()
        run: |
          if [[ -f build/application.pid ]]; then
            kill "$(cat build/application.pid)" 2>/dev/null || true
          fi
          docker compose down --volumes --remove-orphans
