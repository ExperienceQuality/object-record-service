name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional GHCR tag; defaults to manual-<run number>
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish GHCR image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve image tags
        id: image
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/routine-service"
          stable=false

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Release tags must use semantic version form, for example v1.2.3" >&2
              exit 1
            fi
            tag="${GITHUB_REF_NAME#v}"
            if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              stable=true
            fi
          elif [[ -n "$REQUESTED_TAG" ]]; then
            tag="$REQUESTED_TAG"
          else
            tag="manual-${GITHUB_RUN_NUMBER}"
          fi

          if [[ ! "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Invalid OCI image tag: $tag" >&2
            exit 1
          fi

          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build OCI image
        run: ./gradlew --no-daemon bootBuildImage --imageName="${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}"

      - name: Publish immutable image tags
        run: |
          image="${{ steps.image.outputs.name }}"
          release_image="$image:${{ steps.image.outputs.tag }}"
          sha_image="$image:sha-${GITHUB_SHA}"

          docker tag "$release_image" "$sha_image"
          docker push "$release_image"
          docker push "$sha_image"

          if [[ "${{ steps.image.outputs.stable }}" == "true" ]]; then
            docker tag "$release_image" "$image:latest"
            docker push "$image:latest"
          fi

      - name: Resolve published digest
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect \
            "${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate image SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          format: spdx-json
          output-file: build/routine-service.spdx.json
          artifact-name: routine-service-${{ steps.image.outputs.tag }}.spdx.json
          upload-release-assets: false

      - name: Attest image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Attest image SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: build/routine-service.spdx.json
          push-to-registry: true
